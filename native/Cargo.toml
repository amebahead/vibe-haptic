[package]
name = "vibe-haptic-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", features = ["napi8"] }
napi-derive = "2.16"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
foreign-types = "0.5"
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication"] }
libc = "0.2"

[build-dependencies]
napi-build = "2.1"
